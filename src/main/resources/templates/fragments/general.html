<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="baseheader(title)">
    <meta charset="UTF-8">

    <title th:replace="${title}">Base title</title>
    <link rel="stylesheet" href="/css/Style.css">
</head>
<body>

    <nav th:fragment="navbar">
        <ul>
            <li>
                <a  href="/song/all"
                    th:classappend="${activePage == 'songs'} ? 'active' : ''">
                    Nummers
                </a>
            </li>
            <li>
                <a  href="/artist/all"
                    th:classappend="${activePage == 'artists'} ? 'active' : ''">
                    Artiesten
                </a>
            </li>
        </ul>
    </nav>

    <footer th:fragment="footer">
        <p>&copy;SongScore - Mart Stukje 2026</p>
    </footer>

</body>
</html>
