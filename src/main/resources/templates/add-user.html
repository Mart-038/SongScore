<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{/fragments/general :: baseheader(~{:: title})}">
    <title>Gebruiker toevoegen</title>
</head>
<body>
<nav th:replace="~{/fragments/general :: navbar}"></nav>

<div class="container">
    <h1>Nieuwe gebruiker aanmaken</h1>

    <form th:action="@{/user/add}" method="post"
          th:object="${newUser}">

        <div class="mb-3">
            <label for="username" class="form-label">Gebruikersnaam</label>
            <input type="text" id="username"
                   class="form-control" th:field="*{username}" required/>
        </div>

        <div class="mb-3">
            <label for="plainPassword" class="form-label">Wachtwoord</label>
            <input type="password" id="plainPassword"
                   class="form-control"
                   th:field="*{plainPassword}" required/>
        </div>

        <div class="mb-3">
            <label for="role" class="form-label">Rol</label>
            <select id="role" class="form-select" th:field="*{role}">
                <option value="USER">User</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Aanmaken</button>
        <a th:href="@{/user/all}" class="btn btn-secondary">Annuleren</a>
    </form>
</div>

<footer th:replace="~{/fragments/general :: footer}"></footer>

<div th:replace="~{/fragments/general :: scripts}"></div>
</body>
</html>
