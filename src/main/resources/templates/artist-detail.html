<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{/fragments/general :: baseheader(~{:: title})}">
    <title th:text="${artist.name}">Artiestoverzicht</title>
</head>
<body>
<nav th:replace="~{/fragments/general :: navbar}"></nav>

<div class="container">
    <h1 th:text="${artist.name}">Detailpagina</h1>

    <div class="row">
        <div class="col">
            <p>Deze artiest is begonnen in <span th:text="${artist.activeSince}">jaar</span></p>
        </div>
        <div class="col">
            <div class="gap-2 justify-content-center pb-5">
                <a th:href="@{/artist/edit/{artist}(artist=${artist.name})}">
                    <button class="btn btn-primary rounded-circle p-3 lh-1" type="button">
                        <i class="bi bi-pencil-square"></i>
                    </button>
                </a>
            </div>
            <div class="gap-2 justify-content-center pb-5">
                <a th:href="@{/artist/delete/{artist}(artist=${artist.name})}">
                    <button class="btn btn-primary rounded-circle p-3 lh-1" type="button">
                        <i class="bi bi-trash"></i>
                    </button>
                </a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{/fragments/general :: footer}"></footer>

<div th:replace="~{/fragments/general :: scripts}"></div>
</body>
</html>
