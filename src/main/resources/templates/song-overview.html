<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{/fragments/general :: baseheader(~{:: title})}">
    <title>Nummeroverzicht</title>
</head>
<body>
    <nav th:replace="~{/fragments/general :: navbar}"></nav>

    <div class="container">
        <h1>Nummeroverzicht</h1>

        <div class="row">
            <div class="col-sm-4">
                <form method="get" action="/song/all" class="mb-3">
                    <input type="text" name="query" id="zoeken"
                           th:value="${query}"
                           placeholder="Zoek op titel...">
                    <button type="submit"><label for="zoeken">Zoeken</label></button>
                </form>
            </div>
            <div class="col-sm-4">
                <p><a th:href="@{/song/add}">Een nummer toevoegen</a></p>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="song : ${songs}">
                <a th:href="@{/song/detail/{artistName}/{title}
                   (artistName=${song.artists[0].name}, title=${song.title})}"
                   th:object="${song}"
                   class="text-decoration-none text-dark w-100">
                    <div class="card shadow-sm w-100 h-100">
                        <div class="ratio ratio-1x1">
                            <img th:if="*{albumCover != null}"
                                 th:src="@{/image/{id}(id=*{albumCover.id})}"
                                 class="card-img-top object-fit-cover"
                                 th:alt="*{title}">
                        </div>
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-baseline mb-1">
                                <h2 th:text="*{title}"
                                    class="card-title">Titel</h2>
                                <span th:text="*{year}" class="text-body-secondary small ms-2 flex-shrink-0">
                                    Year
                                </span>
                            </div>
                            <p class="card-subtitle small mb-2 text-body-secondary">
                                <span th:each="artist, iterStat : ${song.artists}">
                                    <span th:text="${artist.name}"></span>
                                    <span th:if="!${iterStat.last}">, </span>
                                </span>
                            </p>
                            <div class="mt-auto pt-2">
                                <span th:text="*{genre}" class="badge text-bg-secondary me-1">
                                    Genre
                                </span>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>

    </div>

    <footer th:replace="~{/fragments/general :: footer}"></footer>

    <div th:replace="~{/fragments/general :: scripts}"></div>
</body>
</html>
